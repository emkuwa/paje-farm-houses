nt.getElementById('register').onclick=async()=>{const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;if(email!=='angelamushi@gmail.com'){msg.textContent='Only the authorized client email can register.';return;}if(password.length<12){msg.textContent='Choose a password of at least 12 characters.';return;}const{error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+'/admin/'}});msg.textContent=error?error.message:'Check your email and confirm your account, then sign in.';};document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';const{error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){msg.textContent=error.message;return;}await check();});</script></body></html>
